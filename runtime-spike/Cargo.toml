[package]
name = "sese-runtime-spike"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmi = "=0.40.0"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wat = "1"
ed25519-dalek = "=2.2.0"

[patch.crates-io]
wasmi = { path = "vendor/wasmi" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "=0.2.191"
